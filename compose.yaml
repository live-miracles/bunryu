# Quick start: `BUNRYU_DASHBOARD_PASSWORD='choose-a-long-password' docker compose up -d`,
# then open http://localhost:8080 and log in with that password. It is only
# needed on the first start (an empty /data volume); after that the volume has it.
services:
    bunryu:
        build: .
        image: bunryu
        # The bundled SRS, goryu and FFmpeg are x86_64 builds. On an ARM host
        # (Apple Silicon) this makes Docker emulate them, for development only.
        platform: linux/amd64
        restart: unless-stopped
        ports:
            - '8080:8080/tcp' # dashboard + API
            - '21935:21935/tcp' # RTMP input
            - '10080:10080/udp' # SRT input
            - '10081:10081/udp' # SRT relay input
        environment:
            # Initial dashboard password (only seeds an empty database).
            BUNRYU_DASHBOARD_PASSWORD: ${BUNRYU_DASHBOARD_PASSWORD:-}
        volumes:
            - bunryu-data:/data
        # Leaves time for the control plane to stop every FFmpeg output cleanly.
        stop_grace_period: 30s
        # Same ceilings as the systemd units: one FFmpeg process per output.
        ulimits:
            nofile: 1048576
        logging:
            driver: json-file
            options:
                max-size: 50m
                max-file: '5'

volumes:
    bunryu-data:
