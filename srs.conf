# Non-default RTMP port: 1935 is on every internet scanner's port list, so
# listening elsewhere keeps drive-by junk out of the logs.
listen              21935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level       warn;

http_api {
    enabled         on;
    # Loopback only: the API lists every active stream name (= stream key) and
    # can kick publishers. The app reaches it over 127.0.0.1.
    listen          127.0.0.1:1985;
}

srt_server {
    enabled         on;
    listen          10080;
    # Pre-shared key checked at the SRT handshake (publish AND play), before any
    # stream processing — unauthenticated connections never get past libsrt.
    # Must match "passphrase" in goryu.json (the relay uses it on
    # both its listener and its leg into this server). 10-79 chars, and keep it
    # alphanumeric: '#' starts a comment here and the app parses this file.
    # server-install.sh replaces this default with a per-server random value.
    passphrase      bunryu-default-srt-passphrase;
}

vhost __defaultVhost__ {
    # srt_to_rtmp is OFF: SRS keeps SRT streams in the native SRT/MPEG-TS domain
    # instead of remuxing them into the RTMP layer (which jittered audio and
    # collapsed multi-track audio to one). The app pulls SRT inputs back via SRT
    # (preserving every audio track and clean timestamps) and RTMP inputs via
    # RTMP; the HLS preview is produced by the app's own ffmpeg, so SRS no longer
    # generates native HLS — hence no hls{} or http_server block here.
    srt {
        enabled     on;
        srt_to_rtmp off;
    }

    # Hooks go to the app's loopback-only hook port (bunryu.json hook_port,
    # default 8082), not the public dashboard port.
    http_hooks {
        enabled     on;
        on_publish  http://127.0.0.1:8082/api/srs/on_publish;
        # Only the app's own ffmpeg (preview/outputs/probes) ever plays streams,
        # always from loopback — the hook rejects plays from anywhere else, so
        # the public ports are ingest-only.
        on_play     http://127.0.0.1:8082/api/srs/on_play;
    }
}
